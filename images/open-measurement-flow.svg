<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Open Measurement: one integration, independent measurement</title>
  <desc id="desc">Inside a mobile app, the OM SDK captures ad geometry, obstructions, app state and video events. OMID exposes standardized signals to multiple measurement providers, which calculate and report viewability. Viewability describes an opportunity to see an ad, not proof of attention.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#813b36" stroke-width="1.5"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#283842}.label{font-size:17px;letter-spacing:2px;fill:#813b36}.body{font-size:21px}.small{font-size:18px;fill:#59656b}.line{fill:none;stroke:#813b36;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="900" fill="#f7f5ef"/>
  <text x="64" y="74" class="label">MOBILE AD VIEWABILITY</text>
  <text x="64" y="128" font-size="38" font-family="Georgia,serif">One integration. Independent measurement.</text>
  <text x="64" y="169" class="body">Open Measurement SDK provides the signals behind verification.</text>
  <rect x="64" y="220" width="642" height="536" rx="14" fill="#eeece5" stroke="#c5c7bf"/>
  <text x="90" y="258" class="label">MOBILE APP / AD SDK</text>
  <rect x="92" y="287" width="188" height="344" rx="22" fill="#283842"/>
  <rect x="104" y="315" width="164" height="284" rx="4" fill="#fcfbf7"/>
  <rect x="118" y="334" width="135" height="8" rx="4" fill="#d4d6ce"/>
  <rect x="118" y="354" width="108" height="8" rx="4" fill="#d4d6ce"/>
  <rect x="118" y="390" width="136" height="124" rx="4" fill="#e5cda5" stroke="#813b36" stroke-width="2"/>
  <text x="186" y="444" text-anchor="middle" class="body">Ad</text>
  <text x="186" y="474" text-anchor="middle" class="small">on screen</text>
  <rect x="118" y="535" width="135" height="8" rx="4" fill="#d4d6ce"/>
  <rect x="118" y="555" width="112" height="8" rx="4" fill="#d4d6ce"/>
  <text x="186" y="666" text-anchor="middle" class="small">Ad view + player</text>
  <path d="M282 452H323" class="line"/>
  <rect x="337" y="303" width="337" height="284" rx="8" fill="#fcfbf7" stroke="#283842" stroke-width="2"/>
  <text x="362" y="348" font-size="29" font-weight="bold">OM SDK</text>
  <text x="362" y="385" class="small">Captures measurement signals</text>
  <path d="M362 406H649" stroke="#d4d6ce"/>
  <text x="362" y="442" class="body">Ad position + visible area</text>
  <text x="362" y="479" class="body">Obstructions + app state</text>
  <text x="362" y="516" class="body">Video playback events</text>
  <path d="M505 587V624" class="line"/>
  <rect x="337" y="638" width="337" height="78" rx="8" fill="#813b36"/>
  <text x="505" y="670" text-anchor="middle" font-size="25" style="fill:#fff">OMID interface</text>
  <text x="505" y="698" text-anchor="middle" font-size="18" style="fill:#fff">Standardized signals</text>
  <path d="M675 676H748V385H785" class="line"/>
  <path d="M748 676V550H785" class="line"/>
  <text x="795" y="261" class="label">INDEPENDENT PROVIDERS</text>
  <rect x="795" y="303" width="341" height="145" rx="8" fill="#fcfbf7" stroke="#a4aca8"/>
  <text x="819" y="342" font-size="25">Measurement provider A</text>
  <text x="819" y="378" class="small">Verification script receives signals</text>
  <text x="819" y="413" class="body">Calculates + reports viewability</text>
  <rect x="795" y="479" width="341" height="145" rx="8" fill="#fcfbf7" stroke="#a4aca8"/>
  <text x="819" y="518" font-size="25">Measurement provider B</text>
  <text x="819" y="554" class="small">Verification script receives signals</text>
  <text x="819" y="589" class="body">Calculates + reports viewability</text>
  <text x="795" y="682" class="small">Visible area + time in view</text>
  <text x="795" y="713" class="small">inform the viewability result.</text>
  <path d="M64 791H1136" stroke="#c5c7bf"/>
  <text x="64" y="831" class="body">Viewability measures the opportunity to see an ad, not attention.</text>
  <text x="64" y="865" font-size="16" fill="#59656b">Simplified mobile flow · Based on IAB Tech Lab OM SDK integration guidance</text>
</svg>
