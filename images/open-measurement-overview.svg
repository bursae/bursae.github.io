<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Open Measurement</title>
  <desc id="desc">A mobile ad supplies viewability signals through OM SDK and OMID to three independent measurement providers.</desc>
  <defs>
    <style>text{font-family:Inter,'Avenir Next',Arial,sans-serif;fill:#171717}text[fill]{fill:#62645f}.route{fill:none;stroke:#a8ada3;stroke-width:2}.accent{fill:#d22f27}</style>
    <clipPath id="screen"><rect x="111" y="251" width="252" height="448" rx="4"/></clipPath>
  </defs>
  <rect width="1200" height="900" fill="#f6f6f4"/>
  <rect x="72" y="64" width="24" height="4" class="accent"/>
  <text x="72" y="125" font-size="40" font-weight="600" letter-spacing="-1.4">Open Measurement</text>
  <text x="72" y="166" font-size="22" fill="#777">A shared SDK lets independent providers measure whether an ad could be seen.</text>
  <rect x="98" y="225" width="278" height="502" rx="26" fill="#e9eae4" stroke="#a8ada3" stroke-width="2"/>
  <path d="M211 238H263" stroke="#a8ada3" stroke-width="3" stroke-linecap="round"/>
