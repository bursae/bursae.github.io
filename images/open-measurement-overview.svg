  <text x="490" y="456" font-size="17" fill="#62645f" style="font-family:monospace">ad geometry</text>
  <text x="490" y="482" font-size="17" fill="#62645f" style="font-family:monospace">obstructions</text>
  <text x="490" y="508" font-size="17" fill="#62645f" style="font-family:monospace">app state</text>
  <path d="M490 529H690" stroke="#d1d4c9"/>
  <text x="490" y="563" font-size="20" style="font-family:monospace">OMID API</text>
